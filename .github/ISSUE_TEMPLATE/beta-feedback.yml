name: Beta feedback
description: Share what worked, what was confusing, and the value of the result.
labels: [beta-feedback]
body:
  - type: input
    attributes:
      label: BugBonsai version
      placeholder: 0.1.0-beta.3
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Outcome
      options:
        - Produced a useful reproduction
        - Produced a reproduction that was still too large
        - Preserved the wrong failure
        - Could not complete
        - Exploring the workflow
    validations:
      required: true
  - type: input
    attributes:
      label: Ecosystem
      description: Runtime, framework, test runner, bundler, and package manager names and versions.
      placeholder: Node 24, Vite 7, pnpm 11
    validations:
      required: true
  - type: textarea
    attributes:
      label: Experience
      description: What was valuable, slow, surprising, or unclear?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Aggregate result
      description: Before/after file and byte counts. Do not paste private source or raw logs.
      placeholder: Original 1,284 files / 2.1 GB; reproduction 9 files / 1.8 MB
  - type: input
    attributes:
      label: Candidate runs and duration
      description: Approximate values are useful if exact values are unavailable.
      placeholder: 47 candidate runs in 8 minutes
  - type: dropdown
    attributes:
      label: Recipient verification
      description: Result of `npx bugbonsai@beta verify ./bugbonsai-repro --no-install`.
      options:
        - Passed
        - Failed
        - Not attempted
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed secrets, private paths, source, and environment values.
          required: true
